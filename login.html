<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M.E.C.A. - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body style="display: flex; flex-direction: column; min-height: 100vh">
    <!-- Header sencillo -->
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">M.E.C.A.</a>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="register.html">Crear Cuenta</a></li>
        </ul>
      </nav>
    </header>

    <!-- Contenedor Principal de Login -->
    <main
      style="
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      "
    >
      <div
        class="card"
        style="width: 100%; max-width: 400px; box-shadow: var(--sombra)"
      >
        <h2
          style="
            color: var(--azul-meca);
            text-align: center;
            margin-bottom: 0.5rem;
          "
        >
          Bienvenido de nuevo
        </h2>
        <p
          style="
            text-align: center;
            color: var(--texto-secundario);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
          "
        >
          Ingresa tus datos para acceder a M.E.C.A.
        </p>

        <form id="standaloneLoginForm">
          <div class="form-group">
            <label for="loginEmail">Correo Electrónico</label>
            <input
              type="email"
              id="loginEmail"
              required
              placeholder="tuemail@ejemplo.com"
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <input
              type="password"
              id="loginPassword"
              required
              placeholder="••••••••"
            />
          </div>

          <button
            type="submit"
            class="btn-primary"
            style="width: 100%; margin-top: 1rem"
          >
            Iniciar Sesión
          </button>
          <p id="loginStatus" role="status" style="margin-top: 1rem; text-align: center;"></p>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem">
          <p>
            ¿Aún no tienes una cuenta?
            <a
              href="register.html"
              style="
                color: var(--azul-meca);
                font-weight: 600;
                text-decoration: none;
              "
              >Regístrate aquí</a
            >
          </p>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-bottom" style="border: none; padding-top: 0">
        <p>&copy; 2026 M.E.C.A. - Todos los derechos reservados.</p>
      </div>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
